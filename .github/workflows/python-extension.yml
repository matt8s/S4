name: Python extension

on:
  push:
    branches:
      - modernize-python-packaging
  pull_request:

jobs:
  linux:
    name: Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            numpy: "1.26.4"
          - python: "3.10"
            numpy: "2.*"
          - python: "3.12"
            numpy: "1.26.4"
          - python: "3.13"
            numpy: "2.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libfftw3-dev libsuitesparse-dev libboost-serialization-dev
      - name: Build and install S4
        run: |
          python -m pip install --upgrade pip
          make S4_pyext PYTHON=python
      - name: Test requested NumPy runtime
        run: |
          python -m pip install --force-reinstall "numpy==${{ matrix.numpy }}"
          python -m pip check
          python - <<'PY'
          import numpy as np
          import S4

          sim = S4.New(Lattice=((1.0, 0.0), (0.0, 1.0)), NumBasis=9)
          sim.SetMaterial(Name="vacuum", Epsilon=1.0)
          sim.AddLayer(Name="top", Thickness=0.0, Material="vacuum")
          sim.AddLayer(Name="bottom", Thickness=0.0, Material="vacuum")
          sim.SetExcitationPlanewave(
              IncidenceAngles=(0.0, 0.0),
              sAmplitude=1.0,
              pAmplitude=0.0,
              Order=0,
          )
          sim.SetFrequency(1.0)

          forward, backward = sim.GetPowerFlux(Layer="top", zOffset=0.0)
          assert np.isfinite(forward.real)
          assert np.isfinite(backward.real)

          efield, hfield = sim.GetFieldsOnGridNumpy(
              z=0.0,
              NumSamples=(4, 4),
          )
          assert efield.shape == (4, 4, 3)
          assert hfield.shape == (4, 4, 3)
          assert np.isfinite(efield).all()
          assert np.isfinite(hfield).all()

          print(S4.__file__)
          PY
