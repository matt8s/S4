name: Python extension

on:
  push:
    branches:
      - modernize-python-packaging
  pull_request:

jobs:
  linux:
    name: Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            numpy: "1.26.4"
          - python: "3.10"
            numpy: "2.*"
          - python: "3.12"
            numpy: "1.26.4"
          - python: "3.13"
            numpy: "2.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libfftw3-dev libsuitesparse-dev libboost-serialization-dev
      - name: Build and install S4
        run: |
          python -m pip install --upgrade pip
          make S4_pyext PYTHON=python
      - name: Test requested NumPy runtime
        run: |
          python -m pip install --force-reinstall "numpy==${{ matrix.numpy }}"
          python -m pip check
          python -c "import S4; print(S4.__file__)"
          python PythonTest.py
